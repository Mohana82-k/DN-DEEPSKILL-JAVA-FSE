<div class="course-list-container">
  <h2>Available Courses</h2>

  <div *ngIf="loading$ | async" class="loading-spinner">
    Loading courses...
  </div>

  <ng-container *ngIf="courses$ | async as courses">
    <div *ngIf="courses.length === 0 && !(loading$ | async)" class="no-courses">
      <p>No courses available at the moment.</p>
    </div>

    <div class="courses-grid" *ngIf="courses.length > 0">
      <div 
        class="course-card" 
        *ngFor="let course of courses; trackBy: trackById"
        appHighlight
      >
        <div class="course-header">
          <h3>{{ course.name }}</h3>
          <span class="course-code">{{ course.code }}</span>
        </div>
        
        <div class="course-details">
          <span class="credits">{{ course.credits | creditLabel }}</span>
          <span class="badge" [ngClass]="'badge-' + course.gradeStatus">
            {{ course.gradeStatus | titlecase }}
          </span>
        </div>

        <div class="course-actions">
          <button 
            *ngIf="!course.isEnrolled" 
            class="btn btn-primary"
            (click)="enroll(course)"
          >
            Enroll
          </button>
          <button 
            *ngIf="course.isEnrolled" 
            class="btn btn-danger"
            (click)="unenroll(course)"
          >
            Unenroll
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
