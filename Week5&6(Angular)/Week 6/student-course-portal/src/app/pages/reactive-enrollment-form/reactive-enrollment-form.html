<div class="form-container">
  <h2>Reactive Enrollment Form</h2>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Student Name:</label>
      <input 
        type="text" 
        formControlName="studentName"
        [ngClass]="{'is-invalid': enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched, 
                    'is-valid': enrollForm.get('studentName')?.valid && enrollForm.get('studentName')?.touched}">
      <div *ngIf="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched" class="error-message">
        <small *ngIf="enrollForm.get('studentName')?.errors?.['required']">Name is required.</small>
        <small *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">Minimum 3 characters required.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input 
        type="email" 
        formControlName="studentEmail"
        [ngClass]="{'is-invalid': enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched, 
                    'is-valid': enrollForm.get('studentEmail')?.valid && enrollForm.get('studentEmail')?.touched}">
      <div *ngIf="enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched" class="error-message">
        <small *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">Email is required.</small>
        <small *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">Enter a valid email.</small>
        <small *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email already taken.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Primary Course ID:</label>
      <input
        type="text"
        formControlName="courseId"
        placeholder="Enter Course ID"
        [ngClass]="{'is-invalid': enrollForm.get('courseId')?.invalid && enrollForm.get('courseId')?.touched, 
                    'is-valid': enrollForm.get('courseId')?.valid && enrollForm.get('courseId')?.touched}">
      <div *ngIf="enrollForm.get('courseId')?.invalid && enrollForm.get('courseId')?.touched" class="error-message">
        <small *ngIf="enrollForm.get('courseId')?.errors?.['required']">Course ID is required.</small>
        <small *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Preferred Semester:</label>
      <select 
        formControlName="preferredSemester"
        [ngClass]="{'is-invalid': enrollForm.get('preferredSemester')?.invalid && enrollForm.get('preferredSemester')?.touched, 
                    'is-valid': enrollForm.get('preferredSemester')?.valid && enrollForm.get('preferredSemester')?.touched}">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="agreeToTerms">
        I agree to the Terms and Conditions
      </label>
      <div *ngIf="enrollForm.get('agreeToTerms')?.invalid && enrollForm.get('agreeToTerms')?.touched" class="error-message">
        <small>You must agree to the terms.</small>
      </div>
    </div>

    <div class="form-section">
      <div formArrayName="skills">
        <h3>Skills</h3>
        <div *ngFor="let skill of skills.controls; let i = index" class="array-item">
          <input type="text" [formControlName]="i" placeholder="Enter Skill">
          <button type="button" class="btn btn-sm btn-danger" (click)="removeSkill(i)">Remove</button>
        </div>
        <button type="button" class="btn btn-sm btn-secondary mt-2" (click)="addSkill()">Add Skill</button>
      </div>
    </div>

    <div class="form-section">
      <h3>Additional Courses</h3>
      <div formArrayName="additionalCourses">
        <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="array-item">
          <input [formControlName]="i" placeholder="Enter Course ID">
          <button type="button" class="btn btn-sm btn-danger" (click)="removeCourse(i)">Remove</button>
        </div>
        <button type="button" class="btn btn-sm btn-secondary mt-2" (click)="addCourse()">Add Another Course</button>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">Submit Application</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
    </div>

  </form>
</div>
