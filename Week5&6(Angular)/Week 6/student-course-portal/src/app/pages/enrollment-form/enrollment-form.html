<div class="form-container">
  <h2>Student Enrollment Form</h2>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

    <div class="form-group">
      <label>Student Name:</label>
      <input
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        #name="ngModel"
        required
        minlength="3"
        [ngClass]="{'is-invalid': name.invalid && name.touched, 'is-valid': name.valid && name.touched}">
      <div *ngIf="name.invalid && name.touched" class="error-message">
        <small *ngIf="name.errors?.['required']">Name is required.</small>
        <small *ngIf="name.errors?.['minlength']">Minimum 3 characters required.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        #email="ngModel"
        required
        email
        [ngClass]="{'is-invalid': email.invalid && email.touched, 'is-valid': email.valid && email.touched}">
      <div *ngIf="email.invalid && email.touched" class="error-message">
        <small *ngIf="email.errors?.['required']">Email is required.</small>
        <small *ngIf="email.errors?.['email']">Enter a valid email.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Course ID:</label>
      <input
        type="text"
        name="courseId"
        [(ngModel)]="courseId"
        #course="ngModel"
        required
        [ngClass]="{'is-invalid': course.invalid && course.touched, 'is-valid': course.valid && course.touched}">
      <div *ngIf="course.invalid && course.touched" class="error-message">
        <small *ngIf="course.errors?.['required']">Course ID is required.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Preferred Semester:</label>
      <select
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        #semester="ngModel"
        required
        [ngClass]="{'is-invalid': semester.invalid && semester.touched, 'is-valid': semester.valid && semester.touched}">
        <option value="">Select</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
      <div *ngIf="semester.invalid && semester.touched" class="error-message">
        <small *ngIf="semester.errors?.['required']">Please select a semester.</small>
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          name="agreeToTerms"
          [(ngModel)]="agreeToTerms"
          #terms="ngModel"
          required>
        I agree to the Terms and Conditions
      </label>
      <div *ngIf="terms.invalid && terms.touched" class="error-message">
        <small>You must agree to the terms.</small>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="btn btn-secondary" (click)="onReset(enrollForm)">Reset</button>
    </div>

  </form>
</div>
