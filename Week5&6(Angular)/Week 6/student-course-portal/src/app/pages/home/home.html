<div class="dashboard-container">
  <h1>Welcome to the {{ portalName }}</h1>
  
  <p class="subtitle">Manage your courses, profile and enrollments easily.</p>
  
  <div class="stats-card">
    <div class="stat-item">
      <span class="stat-label">Courses Available :</span>
      <span class="stat-value">{{ coursesCount$ | async }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Enrolled :</span>
      <span class="stat-value">{{ enrolledCount$ | async }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">GPA :</span>
      <span class="stat-value">{{ (gpa$ | async) || '0.0' }}</span>
    </div>
  </div>
  
  <div class="action-buttons">
    <a routerLink="/enroll" class="btn btn-primary">Enroll Now</a>
    <a routerLink="/courses" class="btn btn-secondary">View Courses</a>
  </div>
</div>
