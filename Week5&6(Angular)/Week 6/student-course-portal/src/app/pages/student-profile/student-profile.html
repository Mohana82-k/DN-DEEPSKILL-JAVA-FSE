<div class="profile-container">
  <h2>Student Profile</h2>
  
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">MP</div>
      <div class="info">
        <h3>Name : {{ studentName }}</h3>
        <p class="email">Email : mohanapriya@student.edu</p>
      </div>
    </div>

    <div class="enrolled-section">
      <h4>Enrolled Courses</h4>
      <ul class="enrolled-list">
        <li *ngFor="let course of (enrolledCourses$ | async)">
          <span class="check">✔</span> {{ course.name }}
        </li>
      </ul>
      <p *ngIf="(enrolledCourses$ | async)?.length === 0" class="text-muted">No courses enrolled yet.</p>
    </div>

    <div class="gpa-section">
      <h4>Current GPA : <span class="gpa-value">{{ (gpa$ | async) || '0.0' }}</span></h4>
    </div>
  </div>
</div>
